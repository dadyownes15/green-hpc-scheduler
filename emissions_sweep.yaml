name: carbon_sweep
method: bayes

metric:
  name: Validation Reward
  goal: maximize

early_terminate:
  type: hyperband
  s: 2
  max_iter: 30
  eta: 3

parameters:
  # --- the two hyperparameters to learn ---
  gae_lambda:
    distribution: uniform
    min: 0.80
    max: 1.00

  gamma:
    # near-1 is sensitive; search a narrow band
    distribution: uniform
    min: 0.95
    max: 0.9995

  # keep rollout length fixed (don’t sweep it)
  episode_length:
    value: 2048

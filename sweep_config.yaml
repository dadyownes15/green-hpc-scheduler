name: multi_env_objective_sweep
method: bayes

metric:
  name: objective
  goal: maximize

parameters:

  episode_length:
    values: [32, 64, 128,256,512,1024,2048]

  max_queue_size:
    values: [64, 128,256,]
  gamma:
    distribution: uniform
    min: 0.95
    max: 0.999

  gae_lambda:
    distribution: uniform
    min: 0.8
    max: 0.9999
  carbon_reward_booster:
    values: [0.001,0.1,1.0,10.0,20.0,50.0]

  batch_size:
    values: [1024, 2048,4096, 8192, 16384,]

  n_epochs:
    values: [1,3, 4, 5,8]

  pi_nn:
    values: ["256,256","512,512", "1024,1024", "4000,1000",]

  vf_nn:
    values: ["512,256", "1024,512", "2048,1024"]

  n_steps:
    values: [8192,16384,32768, 65536]

  total_timesteps:
    values: [327680]

  ent_coef:
    values: [0.0, 0.005, 0.01,0.02]

  learning_rate:
    distribution: uniform 
    min: 0.00005
    max: 0.001

  clip_range:
    values: [0.1, 0.2, 0.3]

  clip_range_vf:
    values: [0.05, 0.1, 0.2]

  max_grad_norm:
    values: [0.3, 0.5, 0.8]

  max_wait_n_jobs:
    values: [2, 4, 6,8]

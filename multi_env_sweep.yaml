name: multi_env_objective_sweep
method: bayes

metric:
  name: objective
  goal: maximize

parameters:
  abs_carbon_reward_clip:
    values: [10, 20, 40, 80]

  wait_reward_clip:
    values: [10,20, 40, 80]

  wait_reward_booster:
    values: [0.01,0.1,0.5, 1.0,2, 5,10,]

  carbon_reward_booster:
    values: [0.01,0.1,0.5, 1.0, 2, 5,10]

  episode_length:
    values: [32, 64, 128,256,512,1024,2048]

  gamma:
    distribution: uniform
    min: 0.95
    max: 0.999

  gae_lambda:
    distribution: uniform
    min: 0.8
    max: 0.9999

  batch_size:
    values: [4096, 8192, 16384,]

  n_epochs:
    values: [1,3, 4, 5,8]

  pi_nn:
    values: ["64,64","256,256","512,512", "1024,1024", "4000,1000", "6000,1500"]

  vf_nn:
    values: ["512,256", "1024,512", "2048,1024"]

  n_steps:
    values: [16384,32768, 65536]

  total_timesteps:
    values: [500000]

  ent_coef:
    values: [0.0, 0.005, 0.01]

  learning_rate:
    values: [0.00005,0.0001, 0.0003, 0.001]

  clip_range:
    values: [0.1, 0.2, 0.3]

  clip_range_vf:
    values: [0.05, 0.1, 0.2]

  max_grad_norm:
    values: [0.3, 0.5, 0.8]


  max_wait_n_jobs:
    values: [2, 4, 6,8]
